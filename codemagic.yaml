workflows:
  distribution-workflow:
    name: Distribution Workflow
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true

    environment:
      flutter: stable
      xcode: latest
      java: 17
      vars:
        BUILD_NUMBER: 1 # default, will be updated
      groups:
        - app_store_credentials # if using automatic signing
        - firebase_credentials  # for Firebase App Distribution

    scripts:
      - name: Print environment
        script: |
          flutter --version
          java -version

      - name: Create .env file
        script: |
          echo $ENV_FILE_BASE64 | base64 --decode > .env

      - name: Create google-services.json
        script: |
          echo $GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > android/app/google-services.json

      - name: Create GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install dependencies
        script: |
          flutter pub get
          cd packages/models && flutter pub get && cd ../..
          cd packages/nextone_core && flutter pub get && cd ../..

      - name: Increment build number in pubspec.yaml
        script: |
          echo "Current build number:"
          current_build=$(grep 'version: ' pubspec.yaml | sed 's/.*+//')
          echo $current_build

          new_build=$((current_build + 1))
          echo "New build number: $new_build"

          # Update pubspec.yaml
          sed -i'' -E "s/version: (.*)\+[0-9]+/version: \1+${new_build}/" pubspec.yaml

          # Set env var for Codemagic builds
          echo "BUILD_NUMBER=$new_build" >> $CM_ENV

      - name: Build Android APK
        script: |
          flutter build apk --debug --build-number=$BUILD_NUMBER

      # Optional Firebase App Distribution for Android
      # - name: Distribute to Firebase App Distribution
      #   script: |
      #     firebase appdistribution:distribute build/app/outputs/flutter-apk/app-debug.apk \
      #       --app $FIREBASE_ANDROID_APP_ID \
      #       --groups testers \
      #       --token $FIREBASE_TOKEN

      # Optional iOS build & distribution when ready
      # - name: Build iOS IPA
      #   script: |
      #     flutter build ipa --debug --no-codesign --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/ios/ipa/*.ipa

    publishing:
      scripts:
        - name: Commit updated pubspec.yaml to repo
          script: |
            git config --global user.email "codemagic-bot@codemagic.io"
            git config --global user.name "Codemagic Bot"

            git add pubspec.yaml
            git commit -m "chore: increment build number to $BUILD_NUMBER [skip ci]" || echo "No changes to commit"
            git push origin HEAD:develop
